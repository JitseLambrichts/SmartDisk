name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --workspace --locked
      - run: bash -n scripts/*.sh
      - run: scripts/check-secrets.sh
  macos-package:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: swift test --package-path macos
      - run: scripts/package-release.sh --universal
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SmartDisk-macOS-universal
          path: |
            dist/SmartDisk-*-macOS-universal.zip
            dist/SmartDisk-*-macOS-universal.zip.sha256
          if-no-files-found: error
          retention-days: 30
