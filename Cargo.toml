[workspace]
resolver = "2"
members = ["crates/core", "crates/fs", "crates/cli"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
sha2 = "0.10"
dirs = "5"
libc = "0.2"
notify = "6"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
fuser = { version = "=0.15.1", default-features = false }
